- name: Update & Upgrade
  hosts: all
  become: yes  # sudo මගින් ක්‍රියාත්මක වීමට මෙය අවශ්‍යයි
  tasks:


  - name: Update 
    tags: Update
    apt:
      update_cache: yes
    when: ansible_facts["distribution"] == "Ubuntu"

   - name: Upgrade
    tags: Upgrade
    apt:
      upgrade: dist
    when: ansible_facts["distribution"] == "Ubuntu"
